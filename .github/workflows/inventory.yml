name: Inventory sync
on:
  schedule:
    - cron: '17 11 * * *'   # 5:17 AM Central
    - cron: '17 23 * * *'   # 5:17 PM Central
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: inventory-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Crawl
        env:
          JAZEL_KEY: ${{ secrets.JAZEL_KEY }}
        run: python crawler/crawl.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- inventory/inventory.json; then echo "No change"; exit 0; fi
          git config user.name "inventory-sync"
          git config user.email "actions@users.noreply.github.com"
          git add inventory/inventory.json
          git commit -m "Inventory sync $(date -u +%F\ %H:%M) UTC"
          git push
