name: Inventory sync
on:
  schedule:
    - cron: '17 5,11,17,23 * * *'   # every 6 hours; GitHub delays scheduled runs, so four triggers guarantee at least two good refreshes a day
  workflow_dispatch:
    inputs:
      probe:
        description: 'Diagnostics only, no data written'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: inventory-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Crawl
        env:
          JAZEL_KEY: ${{ secrets.JAZEL_KEY }}
          PROBE: ${{ github.event.inputs.probe }}
        run: python crawler/crawl.py
      - name: Commit if changed
        run: |
          git config user.name "inventory-sync"
          git config user.email "actions@users.noreply.github.com"
          git add inventory/inventory.json inventory/meta.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Inventory sync $(date -u +%F\ %H:%M) UTC"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
